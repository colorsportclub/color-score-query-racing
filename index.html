<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>COLOR｜競速成績查詢系統</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#20242a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:940px;margin:auto;padding:28px 18px 65px}.panel{background:#fff;border:1px solid #e8ebf0;border-radius:20px;box-shadow:0 10px 36px #202b3910;padding:25px;margin-bottom:20px}.hero{text-align:center}.logo{display:block;width:min(280px,78%);height:auto;margin:0 auto 10px}h1{font-size:clamp(22px,4vw,30px);margin:6px 0}h2{font-size:20px;margin:0 0 16px}.muted{color:#657080;font-size:14px}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end}label{display:block;font-weight:650;font-size:14px;margin-bottom:8px}select,input{width:100%;border:1px solid #cbd2dd;border-radius:11px;padding:13px;font:inherit;background:#fff;min-height:48px}button{border:0;border-radius:11px;padding:13px 24px;background:#161c25;color:#fff;font:inherit;font-weight:700;min-height:48px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.error{color:#b02b2b}.status{margin:12px 0 0;min-height:20px}.hidden{display:none}.best{background:#f0f8f3;border:1px solid #cfe6d6;border-radius:12px;padding:10px 13px;margin:10px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.best strong{font-size:20px;color:#177340;white-space:nowrap}.best .bestmeta{font-size:12px;color:#657080}.rowhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.tablebox{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf0f4;font-size:14px}th{background:#f8f9fb;color:#536071}td.num{font-weight:750}details{margin:4px 0}summary{cursor:pointer;color:#24588e}small{font-size:12px}.foot{text-align:center;color:#7a8390;font-size:12px;margin-top:25px}/* L 欄說明：有填寫才顯示 */.score-note{margin-top:7px;padding:7px 9px;background:#fffbeb;border-left:3px solid #d97706;border-radius:6px;color:#92400e;font-size:12px;font-weight:650;overflow-wrap:anywhere}
/* 減少手機繪製負擔 */
@media(max-width:650px){.panel{box-shadow:none}.score-card{box-shadow:none}}
/* 手機直接顯示全部圈數：不需要橫向捲動或展開 */
.score-list{display:grid;gap:9px}.score-card{border:1px solid #e7ebf0;border-radius:12px;padding:11px 12px;background:#fff}.score-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.score-date{font-size:13px;font-weight:700}.score-total{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}.score-info{display:flex;flex-wrap:wrap;gap:3px 9px;margin:5px 0 8px;color:#647080;font-size:11px}.lap-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}.lap{background:#f5f7fa;border-radius:7px;padding:6px 2px;text-align:center;min-width:0}.lap-label{font-size:10px;color:#7c8592;display:block}.lap-value{font-size:12px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}.score-card.is-best{border-color:#9fcdb0}.best-tag{font-size:10px;color:#177340;font-weight:700}.rowhead h2{margin-bottom:0}
@media(max-width:650px){.form{grid-template-columns:1fr;gap:10px}.panel{padding:13px;margin-bottom:10px;border-radius:14px}.wrap{padding:9px 9px 24px}.hero{padding:11px}.logo{width:min(135px,43%);margin-bottom:3px}.hero h1{font-size:18px;margin:3px 0}.hero .muted{font-size:11px}select,input,button{min-height:42px;padding:9px 11px}.rowhead{align-items:center;flex-direction:row;gap:5px}.rowhead h2{font-size:16px}.best{padding:8px 10px}.best strong{font-size:18px}.score-list{gap:7px}.score-card{padding:9px 10px}.score-info{margin:4px 0 6px}.lap{padding:5px 1px}.lap-value{font-size:11px}.foot{margin-top:10px}}
</style>
</head>
<body><main class="wrap">
<section class="panel hero"><img src="logo.jpg" class="logo" alt="COLOR Logo" decoding="async" fetchpriority="high"><h1>競速成績查詢系統</h1><div class="muted">COLOR SPEED RESULTS</div></section>
<section class="panel"><form id="form" class="form"><div><label for="activity">活動名稱</label><select id="activity" required><option value="">正在載入活動…</option></select></div><div><label for="name">學員姓名</label><input id="name" type="text" maxlength="50" placeholder="請輸入完整姓名" autocomplete="off" required></div><button id="submit" type="submit">查詢成績</button></form><p id="status" class="status muted" role="status" aria-live="polite"></p></section>
<section id="result" class="panel hidden" aria-live="polite"><div class="rowhead"><h2 id="person"></h2><span id="count" class="muted"></span></div><div id="best" class="best hidden"><div><span style="font-size:12px;font-weight:700">🏆 個人最佳</span><div id="bestDate" class="bestmeta"></div></div><strong id="bestScore"></strong></div><div class="rowhead" style="margin:0 0 10px"><h2>歷史成績</h2><span class="muted" style="font-size:11px"></span></div><div id="rows" class="score-list"></div></section>
<p class="foot">網站成績僅供參考 實際以教練紀錄為主</p>
</main>
<script>
'use strict';
// 必填：貼上 Apps Script 部署後的 /exec 網址。
const API_URL = 'https://script.google.com/macros/s/AKfycbyfSwfsSmTgIiBgzo74rh4FStNLhjVcOOtMy1wxAgCnkdhgcWwgaUiuGz07PtHk0_PUOg/exec';
const $ = id => document.getElementById(id);
function setStatus(message,error=false){$('status').textContent=message;$('status').className='status '+(error?'error':'muted')}
function request(params){
 return new Promise((resolve,reject)=>{
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(API_URL)){reject(new Error('尚未設定 Apps Script 網址'));return}
  const callback='COLORcallback_'+Date.now()+'_'+Math.random().toString(36).slice(2,10);
  const script=document.createElement('script');let finished=false;
  const timer=setTimeout(()=>finish(new Error('連線逾時，請稍後重試')),25000);
  function finish(err,data){if(finished)return;finished=true;clearTimeout(timer);delete window[callback];script.remove();err?reject(err):resolve(data)}
  window[callback]=data=>finish(null,data);
  const u=new URL(API_URL);Object.entries({...params,callback}).forEach(([k,v])=>u.searchParams.set(k,v));
  script.src=u.toString();script.onerror=()=>finish(new Error('無法連線至成績服務'));document.head.appendChild(script);
 });
}
function text(tag,value,className=''){const el=document.createElement(tag);el.textContent=value==null?'':String(value);if(className)el.className=className;return el}
// 不使用活動清單快取；每次開啟都重新取得最新活動。
function showActivities(activities){
 const select=$('activity');const current=select.value;
 select.replaceChildren(text('option','請選擇活動'));select.firstChild.value='';
 activities.forEach(a=>{const opt=text('option',a);opt.value=a;select.appendChild(opt)});
 if(activities.includes(current))select.value=current;
 setStatus(activities.length?'請選擇活動並輸入完整姓名':'尚無符合格式的活動分頁');
}
async function loadActivities(){
 try{
  const r=await request({action:'activities'});
  if(!r.ok)throw Error(r.error);
  if(!Array.isArray(r.activities))throw Error('活動資料格式錯誤');
  showActivities(r.activities);
 }catch(e){setStatus(e.message,true);$('activity').replaceChildren(text('option','活動載入失敗'))}
}
$('form').addEventListener('submit',async e=>{
 e.preventDefault();const activity=$('activity').value,name=$('name').value.trim();if(!activity||!name){setStatus('請選擇活動並輸入姓名',true);return}
 $('submit').disabled=true;$('result').classList.add('hidden');setStatus('正在查詢成績…');
 try{const r=await request({action:'search',activity,name});if(!r.ok)throw Error(r.error);render(r);setStatus(r.records.length?'查詢完成':'找不到符合的成績紀錄')}
 catch(err){setStatus(err.message,true)}finally{$('submit').disabled=false}
});
function render(r){$('result').classList.remove('hidden');$('person').textContent=r.name+'｜'+r.activity;$('count').textContent='共 '+r.records.length+' 筆';
 $('best').classList.toggle('hidden', !r.best);if(r.best){$('bestScore').textContent=r.best.total+' 秒';$('bestDate').textContent=r.best.date}
 const body=$('rows');body.replaceChildren();
 if(!r.records.length){body.appendChild(text('p','沒有符合的歷史成績','muted'));return}
 r.records.forEach(rec=>{
  const card=document.createElement('article');card.className='score-card';
  const top=document.createElement('div');top.className='score-top';
  const left=document.createElement('div');left.appendChild(text('div',rec.date||'未填日期','score-date'));
  if(r.best && rec.date===r.best.date && rec.total===r.best.total)left.appendChild(text('span','🏆 最佳成績','best-tag'));
  top.appendChild(left);top.appendChild(text('div',(rec.total||'—')+' 秒','score-total'));card.appendChild(top);
  const info=document.createElement('div');info.className='score-info';
  [rec.group,rec.place,rec.item].filter(Boolean).forEach(v=>info.appendChild(text('span',v)));card.appendChild(info);
  const laps=document.createElement('div');laps.className='lap-grid';
  for(let i=0;i<5;i++){
   const lap=document.createElement('div');lap.className='lap';
   lap.appendChild(text('span','lap '+(i+1),'lap-label'));
   const val=text('span',rec.laps?.[i]||'—','lap-value');val.title=rec.laps?.[i]||'—';lap.appendChild(val);laps.appendChild(lap);
  }
  card.appendChild(laps);
  if(String(rec.note??'').trim()){card.appendChild(text('div',rec.note,'score-note'));}
  body.appendChild(card);
 });
}
// 畫面先完成首次繪製，再讀取活動清單。
requestAnimationFrame(()=>setTimeout(loadActivities,0));
</script></body></html>
